[build-system]
requires = ["hatchling>1.26"]
build-backend = "hatchling.build"

[project]
name = "s3cdsapi"
authors = [
  { name = "mullenkamp", email = "mullenkamp1@gmail.com" }
]
description = "cdsapi for s3 and local files"
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = [
  'booklet>=0.7.8',
  's3func>=0.7.0',
  'pandas<3',
  'numpy',
  'urllib3>=2',
  'msgspec',
]

[project.urls]
Documentation = "https://mullenkamp.github.io/s3cdsapi/"
Source = "https://github.com/mullenkamp/s3cdsapi"

[dependency-groups]
dev = [
  "spyder-kernels==2.5.2",
  "black",
  "mypy",
  "ruff",
  "pytest",
  "pytest-cov",
]

[tool.hatch]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/s3cdsapi",
]
exclude = [
    "/s3cdsapi/tests/*",
]

[tool.hatch.version]
path = "s3cdsapi/__init__.py"

[tool.black]
target-version = ["py37"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.isort]
known-first-party = ["s3cdsapi"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["s3cdsapi", "tests"]
branch = true
parallel = true
omit = [
  "src/s3cdsapi/__about__.py",
]

[tool.coverage.paths]
s3cdsapi = ["src/s3cdsapi", "*/s3cdsapi/src/s3cdsapi"]
tests = ["tests", "*/s3cdsapi/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
